name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenCode V1
        run: npm install --global opencode-ai@1.18.35
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check types and tests
        run: bun run check
      - name: Check package and isolated server
        run: bun run check:package
